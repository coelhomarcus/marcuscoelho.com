name: marcuscoelho

services:
  app:
    build:
      context: .
    container_name: marcuscoelho-app
    restart: unless-stopped
    env_file:
      - api/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://marcuscoelho:marcuscoelho@postgres:5432/marcuscoelho
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: marcuscoelho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: marcuscoelho
      POSTGRES_USER: marcuscoelho
      POSTGRES_PASSWORD: marcuscoelho
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marcuscoelho -d marcuscoelho"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
