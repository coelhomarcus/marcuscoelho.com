server {
    listen 5189;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate the HTML so new deploys are picked up right away
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # JS/CSS are emitted by Vite with content hashes in the file name
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Files from public/ keep their names, so cache briefly and revalidate
    location ~* \.(png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
}
